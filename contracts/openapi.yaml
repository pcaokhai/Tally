      x-story: TLY-508
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestClock'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestClock'
        default:
          $ref: '#/components/responses/Problem'
  /v1/test_clocks/{id}/advance:
    post:
      operationId: advanceTestClock
      tags:
      - Testing
      summary: Advance time and run due billing
      description: Story TLY-508.
      x-story: TLY-508
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestClockAdvance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestClock'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          examples:
          - IDEMPOTENCY_KEY_REUSED
        param:
          type:
          - string
          - 'null'
        request_id:
          type: string
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units. Never a float.
        currency:
          type: string
          pattern: ^[a-z]{3}$
    Timestamp:
      type: string
      format: date-time
    Me:
      type: object
      required:
      - user
      - active_tenant
      - memberships
      properties:
        user:
          type: object
          required:
          - id
          - email
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
        active_tenant:
          type: object
          required:
          - id
          - name
          - role
          properties:
            id:
              type: string
            name:
              type: string
            role:
              type: string
              enum:
              - OWNER
              - ADMIN
              - DEVELOPER
              - FINANCE
              - VIEWER
        memberships:
          type: array
          items:
            type: object
            required:
            - tenant_id
            - tenant_name
            - role
            properties:
              tenant_id:
                type: string
              tenant_name:
                type: string
              role:
                type: string
        livemode:
          type: boolean
    ReportSummary:
      type: object
      required:
      - revenue_this_month
      - mrr
      - outstanding
      - failed_payments_7d
      properties:
        revenue_this_month:
          $ref: '#/components/schemas/Money'
        revenue_prev_month:
          $ref: '#/components/schemas/Money'
        mrr:
          $ref: '#/components/schemas/Money'
        active_subscriptions:
          type: integer
        outstanding:
          $ref: '#/components/schemas/Money'
        outstanding_invoice_count:
          type: integer
        overdue:
          $ref: '#/components/schemas/Money'
        failed_payments_7d:
          type: integer
    RevenueSeries:
      type: object
      required:
      - range
      - points
      - total
      properties:
        range:
          type: string
          enum:
          - 7D
          - 30D
          - 12M
        total:
          $ref: '#/components/schemas/Money'
        points:
          type: array
          items:
            type: object
            required:
            - date
            - amount
            properties:
              date:
                type: string
                format: date
              amount:
                type: integer
    MrrByPlan:
      type: object
      required:
      - total
      - plans
      properties:
        total:
          $ref: '#/components/schemas/Money'
        plans:
          type: array
          items:
            type: object
            required:
            - product_id
            - name
            - mrr
            properties:
              product_id:
                type: string
              name:
                type: string
              mrr:
                $ref: '#/components/schemas/Money'
              subscription_count:
                type: integer
    AttentionItem:
      type: object
      required:
      - id
      - kind
      - title
      - detail
      - action
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - PAYMENTS_FAILED
          - ENDPOINT_DISABLED
          - INVOICE_OVERDUE
          - TRIAL_ENDING
        title:
          type: string
        detail:
          type: string
        action:
          type: object
          required:
          - label
          - target
          properties:
            label:
              type: string
            target:
              type: string
    Customer:
      type: object
      required:
      - id
      - email
      - currency
      - status
      - created_at
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        currency:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAST_DUE
          - TRIALING
          - CHURNED
        mrr:
          $ref: '#/components/schemas/Money'
        open_balance:
          $ref: '#/components/schemas/Money'
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CustomerCreate:
      type: object
      required:
      - email
      - currency
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        currency:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    CustomerUpdate:
      type: object
      required: []
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        metadata:
          type: object
          additionalProperties:
            type: string
    TimelineEntry:
      type: object
      required:
      - kind
      - title
      - at
      properties:
        kind:
          type: string
        title:
          type: string
        object_id:
          type: string
        at:
          $ref: '#/components/schemas/Timestamp'
    PaymentMethod:
      type: object
      required:
      - id
      - brand
      - last4
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - CARD
          - ACH
        brand:
          type: string
        last4:
          type: string
          pattern: ^[0-9]{4}$
        exp_month:
          type: integer
        exp_year:
          type: integer
    PaymentMethodSetup:
      type: object
      required:
      - setup_token
      - processor
      properties:
        setup_token:
          type: string
        processor:
          type: string
          enum:
          - STRIPE_TEST
          - SIMULATOR
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    Product:
      type: object
      required:
      - id
      - name
      - kind
      - active
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - SEAT
          - FLAT
          - METERED
        active:
          type: boolean
        subscription_count:
          type: integer
    ProductCreate:
      type: object
      required:
      - name
      - kind
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - SEAT
          - FLAT
          - METERED
    PriceTier:
      type: object
      required:
      - up_to
      - unit_amount
      properties:
        up_to:
          type:
          - integer
          - 'null'
        unit_amount:
          type: integer
        flat_amount:
          type: integer
    Price:
      type: object
      required:
      - id
      - product_id
      - version
      - model
      - currency
      - status
      properties:
        id:
          type: string
        product_id:
          type: string
        version:
          type: integer
        model:
          type: string
          enum:
          - PER_UNIT
          - FLAT
          - GRADUATED
        unit_amount:
          type: integer
        currency:
          type: string
        interval:
          type: string
          enum:
          - MONTH
          - YEAR
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTier'
        status:
          type: string
          enum:
          - CURRENT
          - LEGACY
          - ARCHIVED
        subscription_count:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PriceCreate:
      type: object
      required:
      - model
      - currency
      - interval
      properties:
        model:
          type: string
          enum:
          - PER_UNIT
          - FLAT
          - GRADUATED
        unit_amount:
          type: integer
        currency:
          type: string
        interval:
          type: string
          enum:
          - MONTH
          - YEAR
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTier'
    SubscriptionItem:
      type: object
      required:
      - price_id
      - quantity
      properties:
        id:
          type: string
        price_id:
          type: string
        quantity:
          type: integer
          minimum: 1
    Subscription:
      type: object
      required:
      - id
      - customer_id
      - status
      - items
      - current_period_start
      - current_period_end
      properties:
        id:
          type: string
        customer_id:
          type: string
        status:
          type: string
          enum:
          - TRIALING
          - ACTIVE
          - PAST_DUE
          - CANCELED
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItem'
        mrr:
          $ref: '#/components/schemas/Money'
        current_period_start:
          $ref: '#/components/schemas/Timestamp'
        current_period_end:
          $ref: '#/components/schemas/Timestamp'
        trial_end:
          type:
          - string
          - 'null'
          format: date-time
        cancel_at_period_end:
          type: boolean
        version:
          type: integer
    SubscriptionCreate:
      type: object
      required:
      - customer_id
      - items
      properties:
        customer_id:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubscriptionItem'
        trial_days:
          type: integer
          minimum: 0
          maximum: 90
    SubscriptionUpdate:
      type: object
      required: []
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItem'
        proration:
          type: string
          enum:
          - CREATE_PRORATIONS
          - NONE
    SubscriptionPreviewRequest:
      type: object
      required:
      - customer_id
      - items
      properties:
        customer_id:
          type: string
        subscription_id:
          type:
          - string
          - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItem'
        trial_days:
          type: integer
    SubscriptionPreview:
      type: object
      required:
      - recurring_total
      - due_today
      - lines
      - explanation
      properties:
        recurring_total:
          $ref: '#/components/schemas/Money'
        due_today:
          $ref: '#/components/schemas/Money'
        explanation:
          type: string
        lines:
          type: array
          items:
            type: object
            required:
            - description
            - amount
            properties:
              description:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
              proration:
                type: boolean
    CancelRequest:
      type: object
      required:
      - at
      properties:
        at:
          type: string
          enum:
          - NOW
          - PERIOD_END
    InvoiceLine:
      type: object
      required:
      - id
      - description
      - quantity
      - amount
      properties:
        id:
          type: string
        description:
          type: string
        quantity:
          type: integer
        unit_amount:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        price_id:
          type: string
        usage_rollup_id:
          type:
          - string
          - 'null'
    InvoiceLineCreate:
      type: object
      required:
      - description
      - quantity
      - unit_amount
      properties:
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_amount:
          type: integer
    Invoice:
      type: object
      required:
      - id
      - customer_id
      - status
      - total
      - amount_due
      - lines
      properties:
        id:
          type: string
        number:
          type:
          - string
          - 'null'
        customer_id:
          type: string
        subscription_id:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - OPEN
          - PAID
          - VOID
          - UNCOLLECTIBLE
        overdue_days:
          type: integer
        total:
          $ref: '#/components/schemas/Money'
        amount_due:
          $ref: '#/components/schemas/Money'
        due_date:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        finalized_at:
          type:
          - string
          - 'null'
          format: date-time
        reminded_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
    InvoiceUpdate:
      type: object
      required: []
      properties:
        due_date:
          type: string
          format: date
        memo:
          type: string
    InvoiceSummary:
      type: object
      required:
      - outstanding
      - overdue
      - paid_this_month
      - counts
      properties:
        outstanding:
          $ref: '#/components/schemas/Money'
        overdue:
          $ref: '#/components/schemas/Money'
        paid_this_month:
          $ref: '#/components/schemas/Money'
        counts:
          type: object
          additionalProperties:
            type: integer
    ReminderRequest:
      type: object
      required:
      - invoice_ids
      properties:
        invoice_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    ReminderAccepted:
      type: object
      required:
      - accepted
      - skipped
      properties:
        accepted:
          type: integer
        skipped:
          type: array
          items:
            type: object
            required:
            - invoice_id
            - reason
            properties:
              invoice_id:
                type: string
              reason:
                type: string
    PaymentAttempt:
      type: object
      required:
      - attempt_no
      - outcome
      - attempted_at
      properties:
        attempt_no:
          type: integer
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - DECLINED
          - ERROR
          - TIMEOUT
        failure_code:
          type:
          - string
          - 'null'
        attempted_at:
          $ref: '#/components/schemas/Timestamp'
    Payment:
      type: object
      required:
      - id
      - customer_id
      - amount
      - status
      - created_at
      properties:
        id:
          type: string
        customer_id:
          type: string
        invoice_id:
          type:
          - string
          - 'null'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
          - PROCESSING
          - SUCCEEDED
          - FAILED
          - REFUNDED
          - PARTIALLY_REFUNDED
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
        next_retry_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
    PaymentCreate:
      type: object
      required:
      - customer_id
      - amount
      - payment_method_id
      properties:
        customer_id:
          type: string
        invoice_id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        payment_method_id:
          type: string
    PaymentSummary:
      type: object
      required:
      - collected_this_month
      - success_rate
      - refunded_this_month
      - failed_count
      properties:
        collected_this_month:
          $ref: '#/components/schemas/Money'
        success_rate:
          type: number
        refunded_this_month:
          $ref: '#/components/schemas/Money'
        failed_count:
          type: integer
    Refund:
      type: object
      required:
      - id
      - payment_id
      - amount
      - status
      properties:
        id:
          type: string
        payment_id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
        status:
          type: string
          enum:
          - SUCCEEDED
          - PENDING
          - FAILED
        created_at:
          $ref: '#/components/schemas/Timestamp'
    RefundCreate:
      type: object
      required:
      - payment_id
      - amount
      - reason
      properties:
        payment_id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
    UsageEvent:
      type: object
      required:
      - event_id
      - meter
      - customer_id
      - quantity
      - occurred_at
      properties:
        event_id:
          type: string
          maxLength: 128
        meter:
          type: string
        customer_id:
          type: string
        quantity:
          type: number
          minimum: 0
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    UsageBatch:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UsageEvent'
    UsageAccepted:
      type: object
      required:
      - accepted
      - duplicates
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
    Meter:
      type: object
      required:
      - id
      - key
      - aggregation
      - unit
      properties:
        id:
          type: string
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        aggregation:
          type: string
          enum:
          - SUM
          - MAX
          - UNIQUE_COUNT
        unit:
          type: string
        late_event_policy:
          type: string
          enum:
          - REJECT
          - NEXT_PERIOD
    MeterCreate:
      type: object
      required:
      - key
      - aggregation
      - unit
      properties:
        key:
          type: string
        aggregation:
          type: string
          enum:
          - SUM
          - MAX
          - UNIQUE_COUNT
        unit:
          type: string
        late_event_policy:
          type: string
          enum:
          - REJECT
          - NEXT_PERIOD
    UsageSummary:
      type: object
      required:
      - meter
      - period_start
      - period_end
      - actual
      - projected
      - included
      properties:
        meter:
          type: string
        period_start:
          $ref: '#/components/schemas/Timestamp'
        period_end:
          $ref: '#/components/schemas/Timestamp'
        actual:
          type: number
        projected:
          type: number
        included:
          type: number
        projected_overage_charge:
          $ref: '#/components/schemas/Money'
        series:
          type: array
          items:
            type: object
            required:
            - date
            - cumulative
            properties:
              date:
                type: string
                format: date
              cumulative:
                type: number
              projected:
                type: boolean
    ApiKey:
      type: object
      required:
      - id
      - name
      - prefix
      - last4
      - scopes
      - mode
      - created_at
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        last4:
          type: string
        mode:
          type: string
          enum:
          - LIVE
          - TEST
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ApiKeyCreate:
      type: object
      required:
      - name
      - scopes
      - mode
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        mode:
          type: string
          enum:
          - LIVE
          - TEST
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - payments:write
            - payments:read
            - invoices:write
            - invoices:read
            - customers:write
            - customers:read
            - usage:write
            - webhooks:read
    ApiKeyCreated:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: Returned exactly once (FR-KEY-01).
    WebhookEndpoint:
      type: object
      required:
      - id
      - url
      - event_types
      - status
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - ENABLED
          - DEGRADED
          - CIRCUIT_OPEN
          - DISABLED
        failure_streak:
          type: integer
        disabled_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
    WebhookEndpointCreate:
      type: object
      required:
      - url
      - event_types
      properties:
        url:
          type: string
          format: uri
        event_types:
          type: array
          minItems: 1
          items:
            type: string
    WebhookEndpointUpdate:
      type: object
      required: []
      properties:
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
    WebhookSecret:
      type: object
      required:
      - secret
      - overlap_until
      properties:
        secret:
          type: string
        overlap_until:
          type:
          - string
          - 'null'
          format: date-time
    WebhookEndpointCreated:
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
    EndpointHealth:
      type: object
      required:
      - endpoint_id
      - status
      - success_rate_24h
      - hours
      properties:
        endpoint_id:
          type: string
        status:
          type: string
        success_rate_24h:
          type: number
        p95_ms:
          type: integer
        next_probe_at:
          type:
          - string
          - 'null'
          format: date-time
        hours:
          type: array
          maxItems: 24
          items:
            type: object
            required:
            - hour
            - delivered
            - failed
            properties:
              hour:
                $ref: '#/components/schemas/Timestamp'
              delivered:
                type: integer
              failed:
                type: integer
    DeliveryAttempt:
      type: object
      required:
      - attempt_no
      - attempted_at
      properties:
        attempt_no:
          type: integer
        status_code:
          type:
          - integer
          - 'null'
        latency_ms:
          type: integer
        error:
          type:
          - string
          - 'null'
        attempted_at:
          $ref: '#/components/schemas/Timestamp'
        timing:
          type: object
          required: []
          properties:
            dns_ms:
              type: integer
            connect_ms:
              type: integer
            tls_ms:
              type: integer
            wait_ms:
              type: integer
            download_ms:
              type: integer
    WebhookDelivery:
      type: object
      required:
      - id
      - event_id
      - event_type
      - endpoint_id
      - status
      - attempts
      properties:
        id:
          type: string
        event_id:
          type: string
        event_type:
          type: string
        endpoint_id:
          type: string
        status:
          type: string
          enum:
          - DELIVERED
          - RETRYING
          - FAILED
          - HELD
          - DEAD_LETTERED
        attempt_count:
          type: integer
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        request_headers:
          type: object
          additionalProperties:
            type: string
        response_status:
          type:
          - integer
          - 'null'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
        replay_of:
          type:
          - string
          - 'null'
    Event:
      type: object
      required:
      - id
      - type
      - api_version
      - created_at
      - data
      properties:
        id:
          type: string
        type:
          type: string
        api_version:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
        deliveries:
          type: array
          items:
            type: object
            required:
            - endpoint_id
            - status
            properties:
              endpoint_id:
                type: string
              status:
                type: string
    RequestLog:
      type: object
      required:
      - ts
      - method
      - path
      - status
      - latency_ms
      properties:
        ts:
          $ref: '#/components/schemas/Timestamp'
        method:
          type: string
        path:
          type: string
        status:
          type: integer
        latency_ms:
          type: integer
        api_key_name:
          type:
          - string
          - 'null'
        request_id:
          type: string
    TeamMember:
      type: object
      required:
      - user_id
      - email
      - role
      - status
      properties:
        user_id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - DEVELOPER
          - FINANCE
          - VIEWER
        status:
          type: string
          enum:
          - ACTIVE
          - INVITED
        mfa:
          type: string
    TeamMemberUpdate:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - DEVELOPER
          - FINANCE
          - VIEWER
    InvitationCreate:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - ADMIN
          - DEVELOPER
          - FINANCE
          - VIEWER
    Invitation:
      type: object
      required:
      - id
      - email
      - role
      - expires_at
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    Branding:
      type: object
      required:
      - accent_hex
      properties:
        accent_hex:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        logo_url:
          type:
          - string
          - 'null'
    AccountPlan:
      type: object
      required:
      - plan_code
      - version
      - limits
      properties:
        plan_code:
          type: string
        version:
          type: integer
        renews_at:
          $ref: '#/components/schemas/Timestamp'
        limits:
          type: array
          items:
            type: object
            required:
            - key
            - limit
            - used
            properties:
              key:
                type: string
              limit:
                type: integer
              used:
                type: integer
    ImpersonationSession:
      type: object
      required:
      - id
      - operator_name
      - mode
      - reason
      - started_at
      properties:
        id:
          type: string
        operator_name:
          type: string
        mode:
          type: string
          enum:
          - READ_ONLY
          - WRITE
        reason:
          type: string
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        write_count:
          type: integer
    DataExport:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - READY
          - EXPIRED
        download_url:
          type:
          - string
          - 'null'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    TestClock:
      type: object
      required:
      - id
      - frozen_time
      properties:
        id:
          type: string
        frozen_time:
          $ref: '#/components/schemas/Timestamp'
        subscription_ids:
          type: array
          items:
            type: string
    TestClockAdvance:
      type: object
      required:
      - to
      properties:
        to:
          $ref: '#/components/schemas/Timestamp'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required on writes; replayed for 24 h (ADR-006).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last read; 412 on mismatch.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
    AccessReason:
      name: X-Access-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 4
      description: Recorded in the operator audit log (NFR-ADM-AUD-01).
    DryRun:
      name: dry_run
      in: query
      schema:
        type: boolean
        default: false
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: sk_live_/sk_test_ key or BFF-minted JWT
