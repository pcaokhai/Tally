      x-story: TLY-905
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
          headers:
            ETag:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/test_clocks:
    post:
      operationId: createTestClock
      tags:
      - Testing
      summary: Create a test clock (test mode only)
