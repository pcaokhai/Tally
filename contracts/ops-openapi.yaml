  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required on writes; replayed for 24 h (ADR-006).
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last read; 412 on mismatch.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
    AccessReason:
      name: X-Access-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 4
      description: Recorded in the operator audit log (NFR-ADM-AUD-01).
    DryRun:
      name: dry_run
      in: query
      schema:
        type: boolean
        default: false
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    operatorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
