# Shipped runtime defaults: ports (docs/02 §8, ADR-022) and virtual threads.
#
# These live outside application.yaml because src/test/resources/application.yaml shadows the main
# one on the test classpath (same name, test output first). Both files `spring.config.import` this
# one, so tests run against the real values instead of a copy that can drift. Only the datasource
# and Flyway stay in application.yaml, because that is exactly what the tests turn off.
spring:
  application:
    name: tally-core
  threads:
    virtual:
      enabled: true
  jackson:
    # contracts/openapi.yaml is OpenAPI 3.1: an absent optional property is legal, an explicit null
    # for `type: string` is not. Serializing nulls makes every response off-contract (TLY-004 AC5).
    default-property-inclusion: non_null

logging:
  structured:
    format:
      # docs/02 §7.6 field set. Lives here, not in application.yaml, so tests log the same JSON the
      # shipped app does; src/test/resources/application.yaml would otherwise shadow it.
      console: com.tally.core.kernel.logging.TallyStructuredLogFormatter

server:
  # Tenant API (/v1).
  port: 8080

management:
  server:
    # Actuator only; it never serves /v1 or /ops/v1.
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

tally:
  ops:
    # Operator API (/ops/v1); bound to the ops network only in deployment.
    port: 8081
  security:
    jwt:
      # Realm tally-tenants (ADR-007); TLY-002's compose Keycloak listens on 8180.
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tally-tenants}
      # No audience value is pinned anywhere else yet (docs/02 §7.1 names but doesn't publish the
      # matrix/token shape) — ponytail: one env-overridable default until a real one is decided.
      audience: ${TALLY_JWT_AUDIENCE:tally-api}
