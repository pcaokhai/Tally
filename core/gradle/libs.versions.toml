[versions]
java = "25"
openapiGeneratorPlugin = "7.14.0"
# Pinned individually until TLY-004 replaces these with the Spring Boot BOM.
springWeb = "6.2.1"
springContext = "6.2.1"
springCore = "6.2.1"
jakartaServletApi = "6.1.0"
jakartaValidationApi = "3.1.1"
jakartaAnnotationApi = "3.0.0"
jacksonAnnotations = "2.18.2"
jacksonDatabind = "2.18.2"

[libraries]
spring-web = { module = "org.springframework:spring-web", version.ref = "springWeb" }
spring-context = { module = "org.springframework:spring-context", version.ref = "springContext" }
spring-core = { module = "org.springframework:spring-core", version.ref = "springCore" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakartaServletApi" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakartaValidationApi" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakartaAnnotationApi" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jacksonDatabind" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGeneratorPlugin" }
