[versions]
java = "25"
openapiGeneratorPlugin = "7.14.0"
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
springModulith = "2.1.1"
archunit = "1.5.0"
spotless = "8.10.2"
swaggerRequestValidator = "3.0.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
swagger-request-validator-spring-webmvc = { module = "com.atlassian.oai:swagger-request-validator-spring-webmvc", version.ref = "swaggerRequestValidator" }
# Versions below are supplied by the Spring Boot BOM; never pin them here.
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGeneratorPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
